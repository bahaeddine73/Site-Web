<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="fr" lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Livre d’or - Games Studio</title>
    <link rel="stylesheet" type="text/css" href="../../Styles/style1.css" />
    <link rel="alternate stylesheet" type="text/css" href="../../Styles/style2.css" media="screen" title="style2"/>

</head>
<body>
<h1>Livre d’or de Games Studio</h1>

<p>Vous visitez le site Games Studio ? Laissez-nous un message ! 😊</p>

<form action="http://voca2.univ-poitiers.fr/traitement.php" method="post">
    <fieldset>
        <legend>Laissez un message</legend>

        <p>
            <label for="nom">Votre nom (optionnel) :</label><br/>
            <input type="text" name="nom" id="nom"/>
        </p>

        <p>
            <label for="message">Votre message :</label><br/>
            <textarea name="message" id="message" cols="40" rows="5" required="required"></textarea>
        </p>

        <p>
            <label for="note">Note (1 à 5) :</label><br/>
            <select name="note" id="note">
                <option value="1">1 étoile</option>
                <option value="2">2 étoiles</option>
                <option value="3">3 étoiles</option>
                <option value="4">4 étoiles</option>
                <option value="5">5 étoiles</option>
            </select>
        </p>

        <p>
            <label for="date">Date :</label><br />
            <input type="date" name="date" id="date" />
        </p>

        <p>
            <input type="submit" value="Envoyer" />
            <input type="reset" value="Annuler" />
        </p>
    </fieldset>
</form>
</body>
</html>
